apiVersion: openinspect.dirien.dev/v1alpha1
kind: OpenInspect
metadata:
  labels:
    app.kubernetes.io/name: openinspect-operator
    app.kubernetes.io/managed-by: kustomize
  name: openinspect-modal
  namespace: open-inspect-modal
spec:
  deploymentName: modal
  cloudflare:
    accountId: "3a5b62f8408d9e488350c993fddcb04a"
    apiTokenSecretRef: {name: cloudflare-credentials, key: apiToken}
  # Embedded D1 migrations from the pinned upstream revision apply by
  # default; a migrationsConfigMapRef remains as a development override.
  d1: {}
  kvNamespaces: [session-index]
  r2Buckets: [media]
  workers:
    # No script source: the release's embedded control-plane bundle (built
    # from the pinned upstream revision) deploys by default.
    - name: control-plane
      compatibilityDate: "2024-09-23"
      compatibilityFlags: [nodejs_compat]
      bindings:
        d1: [{binding: DB}]
        kv: [{binding: REPOS_CACHE, namespace: session-index}]
        r2: [{binding: MEDIA_BUCKET, bucket: media}]
        durableObjects:
          - {binding: SESSION, className: SessionDO}
          - {binding: SCHEDULER, className: SchedulerDO}
      vars:
        APP_NAME: Open Inspect
        DEPLOYMENT_NAME: modal
        GITHUB_CLIENT_ID: Iv23litA098xiR1uQwZ5
        WEB_APP_URL: http://localhost:3000
        WORKER_URL: https://open-inspect-control-plane-modal.engin-diri.workers.dev
      secrets:
        - binding: GITHUB_CLIENT_SECRET
          secretRef: {name: platform-secrets, key: githubClientSecret}
        - binding: TOKEN_ENCRYPTION_KEY
          secretRef: {name: platform-secrets, key: tokenEncryptionKey}
        - binding: REPO_SECRETS_ENCRYPTION_KEY
          secretRef: {name: platform-secrets, key: repoSecretsEncryptionKey}
        - binding: INTERNAL_CALLBACK_SECRET
          secretRef: {name: platform-secrets, key: internalCallbackSecret}
        - binding: GITHUB_APP_ID
          secretRef: {name: platform-secrets, key: githubAppId}
        - binding: GITHUB_APP_PRIVATE_KEY
          secretRef: {name: platform-secrets, key: githubAppPrivateKey}
        - binding: GITHUB_APP_INSTALLATION_ID
          secretRef: {name: platform-secrets, key: githubAppInstallationId}
      cron: ["* * * * *"]
  # AppSecrets seeds the platform's global secrets store (Settings->Secrets
  # in the web UI); sandboxes receive these as env vars at creation.
  appSecrets:
    - key: ANTHROPIC_API_KEY
      secretRef: {name: platform-secrets, key: anthropicApiKey}
  sandbox:
    provider: modal
    modal:
      workspace: dirien
      # environment is the Modal environment NAME the operator deploys the
      # upstream app into and resolves it from during cleanup. The app's
      # *.modal.run web suffix is discovered from the deployed endpoints and
      # recorded in status — it is never configured here.
      environment: main
      tokenIdSecretRef: {name: platform-secrets, key: modalTokenId}
      tokenSecretSecretRef: {name: platform-secrets, key: modalTokenSecret}
      apiSecretSecretRef: {name: platform-secrets, key: modalApiSecret}
  web:
    image: open-inspect-web:modal-ce2be05
    replicas: 1
    port: 3000
    env:
      CONTROL_PLANE_URL: https://open-inspect-control-plane-modal.engin-diri.workers.dev
      NEXTAUTH_URL: http://localhost:3000
      GITHUB_CLIENT_ID: Iv23litA098xiR1uQwZ5
      ALLOWED_USERS: dirien
    secretEnv:
      - binding: NEXTAUTH_SECRET
        secretRef: {name: platform-secrets, key: nextauthSecret}
      - binding: GITHUB_CLIENT_SECRET
        secretRef: {name: platform-secrets, key: githubClientSecret}
      - binding: INTERNAL_CALLBACK_SECRET
        secretRef: {name: platform-secrets, key: internalCallbackSecret}
      - binding: ANTHROPIC_API_KEY
        secretRef: {name: platform-secrets, key: anthropicApiKey}
  deletionPolicy: Delete
