name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  goreleaser-snapshot:
    name: GoReleaser snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          distribution: goreleaser
          version: latest
          args: check

      # Cross-compiles the manager for linux/amd64 and linux/arm64 — the same
      # binaries a release would ship. Images are built and pushed exclusively
      # by the Release workflow (GoReleaser dockers_v2, amd64+arm64 manifests
      # to ghcr.io), so CI never needs QEMU or a registry login.
      - name: Build snapshot binaries
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          distribution: goreleaser
          version: latest
          args: build --snapshot --clean

      - name: List built artifacts
        run: ls -la .goreleaser-dist/*/
