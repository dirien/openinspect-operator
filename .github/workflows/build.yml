name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  goreleaser-snapshot:
    name: GoReleaser snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: check

      # Cross-compiles the manager for linux/amd64 and linux/arm64 — the same
      # binaries a release would ship. Images are built and pushed exclusively
      # by the Release workflow (GoReleaser dockers_v2, amd64+arm64 manifests
      # to ghcr.io), so CI never needs QEMU or a registry login.
      - name: Build snapshot binaries
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: build --snapshot --clean

      - name: List built artifacts
        run: ls -la .goreleaser-dist/*/
