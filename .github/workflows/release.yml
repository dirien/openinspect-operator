name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: GoReleaser release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push images + chart to ghcr.io
      id-token: write # keyless cosign signing
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # Creates the GitHub release with a generated changelog and attaches
      # binaries, archives, SBOMs, and checksums; builds and pushes the
      # linux amd64+arm64 image manifests to ghcr.io and cosign-signs
      # images and checksums (.goreleaser.yaml).
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The provider-neutral sandbox runtime base image is release-coupled:
      # it carries the operator version tag, the pinned upstream commit, and
      # the runtime digest, and is cosign-signed with an SBOM like the
      # manager image. linux/amd64 only (upstream pins amd64 artifacts).
      - name: Runtime image metadata
        id: runtime-meta
        run: |
          {
            echo "digest=$(go run ./cmd/runtimegen -digest)"
            echo "upstream=$(cat third_party/background-agents/UPSTREAM_COMMIT)"
            echo "version=${GITHUB_REF_NAME#v}"
            echo "majorminor=$(echo "${GITHUB_REF_NAME#v}" | cut -d. -f1-2)"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push sandbox runtime image
        id: runtime-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/dirien/openinspect-sandbox-runtime:${{ github.ref_name }}
            ghcr.io/dirien/openinspect-sandbox-runtime:${{ steps.runtime-meta.outputs.majorminor }}
            ghcr.io/dirien/openinspect-sandbox-runtime:latest
          labels: |
            org.opencontainers.image.version=${{ steps.runtime-meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Sign sandbox runtime image
        run: cosign sign --yes "ghcr.io/dirien/openinspect-sandbox-runtime@${{ steps.runtime-push.outputs.digest }}"

      # The modal-deploy Job image: pinned Modal CLI + pinned upstream app
      # source (EPIC1 D5). Version-tagged and signed like the others.
      - name: Build and push modal-deploy image
        id: modal-deploy-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.modal-deploy
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/dirien/openinspect-modal-deploy:${{ github.ref_name }}
            ghcr.io/dirien/openinspect-modal-deploy:${{ steps.runtime-meta.outputs.majorminor }}
            ghcr.io/dirien/openinspect-modal-deploy:latest
          labels: |
            org.opencontainers.image.version=${{ steps.runtime-meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            dev.dirien.openinspect.upstream-commit=${{ steps.runtime-meta.outputs.upstream }}

      - name: Sign modal-deploy image
        run: cosign sign --yes "ghcr.io/dirien/openinspect-modal-deploy@${{ steps.modal-deploy-push.outputs.digest }}"

      # Release web images: the unmodified pinned upstream web app, one
      # variant per provider (the provider is baked into the client bundle
      # by upstream's design); the deployment-specific WebSocket URL is
      # wired at runtime by the image entrypoint, so installations never
      # build their own web image.
      - name: Build and push web image (modal)
        id: web-modal-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.web
          build-args: |
            OI_PROVIDER=modal
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/dirien/openinspect-web:${{ github.ref_name }}-modal
            ghcr.io/dirien/openinspect-web:latest-modal
          labels: |
            org.opencontainers.image.version=${{ steps.runtime-meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            dev.dirien.openinspect.upstream-commit=${{ steps.runtime-meta.outputs.upstream }}

      - name: Build and push web image (daytona)
        id: web-daytona-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.web
          build-args: |
            OI_PROVIDER=daytona
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/dirien/openinspect-web:${{ github.ref_name }}-daytona
            ghcr.io/dirien/openinspect-web:latest-daytona
          labels: |
            org.opencontainers.image.version=${{ steps.runtime-meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            dev.dirien.openinspect.upstream-commit=${{ steps.runtime-meta.outputs.upstream }}

      - name: Sign web images
        run: |
          cosign sign --yes "ghcr.io/dirien/openinspect-web@${{ steps.web-modal-push.outputs.digest }}"
          cosign sign --yes "ghcr.io/dirien/openinspect-web@${{ steps.web-daytona-push.outputs.digest }}"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # The chart version and appVersion come from the tag at package time;
      # the committed Chart.yaml version is a placeholder.
      - name: Package and push Helm chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          helm package dist/chart --version "$VERSION" --app-version "$VERSION"
          helm push "openinspect-operator-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts" 2>&1 | tee push.log
          DIGEST="$(awk '/Digest:/ {print $2}' push.log)"
          test -n "$DIGEST" || { echo "::error::could not parse chart digest from helm push output"; exit 1; }
          cosign sign --yes "ghcr.io/$OWNER/charts/openinspect-operator@$DIGEST"
