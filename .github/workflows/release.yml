name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: GoReleaser release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push images + chart to ghcr.io
      id-token: write # keyless cosign signing
    steps:
      - name: Clone the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # Creates the GitHub release with a generated changelog and attaches
      # binaries, archives, SBOMs, and checksums; builds and pushes the
      # linux amd64+arm64 image manifests to ghcr.io and cosign-signs
      # images and checksums (.goreleaser.yaml).
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      # The chart version and appVersion come from the tag at package time;
      # the committed Chart.yaml version is a placeholder.
      - name: Package and push Helm chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          helm package dist/chart --version "$VERSION" --app-version "$VERSION"
          helm push "openinspect-operator-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts" 2>&1 | tee push.log
          DIGEST="$(awk '/Digest:/ {print $2}' push.log)"
          test -n "$DIGEST" || { echo "::error::could not parse chart digest from helm push output"; exit 1; }
          cosign sign --yes "ghcr.io/$OWNER/charts/openinspect-operator@$DIGEST"
