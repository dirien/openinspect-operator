name: E2E Tests

# Manual-only: the kind e2e takes too long for every push/PR. Run it on
# demand from the Actions tab (or via `gh workflow run test-e2e.yml`)
# before releases or after changes to the deploy path.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e

      # Failure-only diagnostics: cost nothing on green runs, save a
      # debug-commit cycle on red ones.
      - name: Dump operator state
        if: failure()
        run: |
          kubectl get deployments,pods -n openinspect-operator-system -o wide || true
          kubectl describe pods -n openinspect-operator-system || true
          kubectl get events -n openinspect-operator-system --sort-by=.lastTimestamp | tail -50 || true

      - name: Dump operator logs
        if: failure()
        run: kubectl logs -n openinspect-operator-system -l control-plane=controller-manager --tail=-1 || true
