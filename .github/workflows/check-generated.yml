name: Generated files

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-generated:
    name: CRDs, RBAC and chart in sync
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Regenerates config/ (controller-gen) and dist/chart (kubebuilder helm
      # plugin) and fails if the committed copies are stale — the chart CRD
      # silently drifting from config/crd is exactly the bug this catches.
      - name: Check generated files are committed
        run: make check-generated
