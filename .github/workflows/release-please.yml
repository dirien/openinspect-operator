name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Release-please and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write # keyless cosign signing
    steps:
      # Maintains a release PR from conventional commits; merging it creates
      # the tag + GitHub release and sets release_created for the steps below.
      # The publish steps run in this same workflow because tags created with
      # GITHUB_TOKEN do not trigger other workflows.
      # Repo setting required: Actions > General > "Allow GitHub Actions to
      # create and approve pull requests".
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # fetch-depth: 0 pulls the tag release-please just created; GoReleaser
      # requires it at HEAD.
      - name: Clone the code
        if: steps.release.outputs.release_created
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        if: steps.release.outputs.release_created
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        if: steps.release.outputs.release_created
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        if: steps.release.outputs.release_created
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: steps.release.outputs.release_created
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: steps.release.outputs.release_created
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        if: steps.release.outputs.release_created
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # Builds the manager binaries, per-arch images + multi-arch manifests,
      # SBOMs, and cosign-signs images and checksums (.goreleaser.yaml);
      # artifacts attach to the release release-please already created.
      - name: Run GoReleaser
        if: steps.release.outputs.release_created
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        if: steps.release.outputs.release_created
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      # Chart.yaml was already bumped by release-please extra-files; the
      # --version/--app-version flags make a stale publish impossible anyway.
      - name: Package and push Helm chart
        if: steps.release.outputs.release_created
        run: |
          VERSION="${TAG_NAME#v}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          helm package dist/chart --version "$VERSION" --app-version "$VERSION"
          helm push "openinspect-operator-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts" 2>&1 | tee push.log
          DIGEST="$(awk '/Digest:/ {print $2}' push.log)"
          test -n "$DIGEST" || { echo "::error::could not parse chart digest from helm push output"; exit 1; }
          cosign sign --yes "ghcr.io/$OWNER/charts/openinspect-operator@$DIGEST"
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
