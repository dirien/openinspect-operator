version: 2

# NOT the default "dist": the kubebuilder helm plugin owns dist/ (dist/chart,
# dist/install.yaml) and `goreleaser release --clean` would wipe it.
dist: .goreleaser-dist

env:
  - CGO_ENABLED=0

builds:
  - binary: manager
    main: ./cmd
    ldflags:
      - -s -w
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README.md

dockers_v2:
  - id: openinspect-operator
    dockerfile: Dockerfile.goreleaser
    images:
      - "ghcr.io/dirien/openinspect-operator"
    tags:
      - "{{ .Tag }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "Kubernetes operator deploying the open-inspect platform to Cloudflare"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.licenses": "Apache-2.0"

signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

docker_signs:
  - cmd: cosign
    artifacts: manifests
    output: true
    args:
      - sign
      - "${artifact}"
      - "--yes"

sboms:
  - artifacts: archive

# release-please owns the GitHub release and its notes; GoReleaser only
# attaches artifacts to it.
release:
  mode: keep-existing

changelog:
  disable: true
