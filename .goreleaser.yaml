version: 2

# NOT the default "dist": the kubebuilder helm plugin owns dist/ (dist/chart,
# dist/install.yaml) and `goreleaser release --clean` would wipe it.
dist: .goreleaser-dist

env:
  - CGO_ENABLED=0

builds:
  - id: manager
    binary: manager
    main: ./cmd
    ldflags:
      - -s -w
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  # Ships in the same image so runtime-build Jobs can run the operator's
  # own image (dockers_v2 copies every build into the context).
  - id: runtime-builder
    binary: runtime-builder
    main: ./cmd/runtime-builder
    ldflags:
      - -s -w
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README.md

dockers_v2:
  - id: openinspect-operator
    dockerfile: Dockerfile.goreleaser
    images:
      - "ghcr.io/dirien/openinspect-operator"
    tags:
      - "{{ .Tag }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "Kubernetes operator deploying the open-inspect platform to Cloudflare"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.licenses": "Apache-2.0"

signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

docker_signs:
  - cmd: cosign
    artifacts: manifests
    output: true
    args:
      - sign
      - "${artifact}"
      - "--yes"

sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^chore"
      - "^docs"
      - "^test"
      - "^ci"
