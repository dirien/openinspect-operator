{{- if .Values.crd.enable }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.20.0
  name: openinspects.openinspect.dirien.dev
spec:
  group: openinspect.dirien.dev
  names:
    kind: OpenInspect
    listKind: OpenInspectList
    plural: openinspects
    shortNames:
    - oi
    singular: openinspect
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.appliedMigrations
      name: Migrations
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: OpenInspect is the Schema for the openinspects API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OpenInspectSpec defines the desired state of one full deployment of the
              open-inspect platform: all Cloudflare resources plus the in-cluster web UI.
            properties:
              adoptExisting:
                description: |-
                  AdoptExisting lets this CR take ownership of Cloudflare resources that
                  already exist under its names (e.g. recreated after a deletionPolicy:
                  Orphan delete). Off by default so one CR can never silently capture
                  resources created by another deployment or tool.
                type: boolean
              appSecrets:
                description: |-
                  AppSecrets seeds the platform's global secrets store (the
                  control-plane worker's /secrets API, injected into sandboxes at
                  creation) from Kubernetes Secrets after each worker deploy. Keys
                  removed from this list are deleted from the store; keys added out of
                  band (e.g. via the web UI) are left alone.
                items:
                  description: |-
                    AppSecret maps one global secret key in the platform's secrets store to
                    the Kubernetes Secret value that backs it. Keys are uppercase because the
                    upstream store uppercases every key on write; admitting other spellings
                    would make spec keys never match the store's listing.
                  properties:
                    key:
                      pattern: ^[A-Z_][A-Z0-9_]*$
                      type: string
                    secretRef:
                      description: SecretKeyRef selects a key of a Secret in the same
                        namespace.
                      properties:
                        key:
                          type: string
                        name:
                          type: string
                      required:
                      - key
                      - name
                      type: object
                  required:
                  - key
                  - secretRef
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-map-keys:
                - key
                x-kubernetes-list-type: map
              cloudflare:
                description: CloudflareSpec holds account credentials and API endpoint.
                properties:
                  accountId:
                    description: AccountID is the Cloudflare account ID all resources
                      are created under.
                    type: string
                  apiBaseURL:
                    description: |-
                      APIBaseURL overrides the Cloudflare API endpoint. Leave empty for
                      https://api.cloudflare.com/client/v4. Used for regional gateways and
                      for e2e tests against a mock API.
                    type: string
                  apiTokenSecretRef:
                    description: APITokenSecretRef points at the API token used for
                      all Cloudflare calls.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - accountId
                - apiTokenSecretRef
                type: object
              d1:
                description: D1Spec describes the single D1 database and its schema
                  migrations.
                properties:
                  migrationsConfigMapRef:
                    description: |-
                      MigrationsConfigMapRef names a ConfigMap whose keys are numbered
                      migration files (e.g. 0001_init.sql), applied in key order and tracked
                      in a _schema_migrations table by numeric prefix (upstream d1-migrate.sh
                      semantics). Empty applies the release's embedded migrations from the
                      pinned upstream revision; the ConfigMap is a development override
                      (reference an empty ConfigMap to apply no migrations at all).
                    type: string
                type: object
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy controls whether external resources are deleted or
                  orphaned when the CR is deleted. Orphan skips ALL external cleanup:
                  besides Cloudflare resources it also leaves running sandbox-provider
                  compute behind (Modal sandboxes and the deployed Modal app, Daytona
                  sandboxes) with nothing left that will ever stop it.
                enum:
                - Delete
                - Orphan
                type: string
              deploymentName:
                description: |-
                  DeploymentName suffixes every Cloudflare resource name and must be
                  unique per Cloudflare account.
                pattern: ^[a-z0-9][a-z0-9-]*$
                type: string
                x-kubernetes-validations:
                - message: deploymentName is immutable
                  rule: self == oldSelf
              emptyBucketsOnDelete:
                description: |-
                  EmptyBucketsOnDelete purges all objects from R2 buckets before deleting
                  them (on CR deletion and when a bucket is removed from spec). Without
                  it, Cloudflare refuses to delete non-empty buckets: CR deletion blocks
                  and pruned buckets are orphaned with a warning event.
                type: boolean
              kvNamespaces:
                description: |-
                  KVNamespaces are logical names; the Cloudflare title becomes
                  <namePrefix>-<name>-<deploymentName>.
                items:
                  pattern: ^[a-z0-9][a-z0-9-]*$
                  type: string
                maxItems: 100
                type: array
              namePrefix:
                default: open-inspect
                pattern: ^[a-z0-9][a-z0-9-]*$
                type: string
                x-kubernetes-validations:
                - message: namePrefix is immutable
                  rule: self == oldSelf
              r2Buckets:
                description: R2Buckets are logical names, expanded like KV namespaces.
                items:
                  pattern: ^[a-z0-9][a-z0-9-]*$
                  type: string
                maxItems: 100
                type: array
              sandbox:
                description: |-
                  Sandbox wires one sandbox provider's configuration into the
                  control-plane worker.
                properties:
                  controlPlaneWorker:
                    default: control-plane
                    description: |-
                      ControlPlaneWorker names the worker (from spec.workers) that receives
                      the provider configuration.
                    type: string
                  daytona:
                    description: DaytonaSandboxSpec configures the Daytona sandbox
                      provider.
                    properties:
                      apiKeySecretRef:
                        description: SecretKeyRef selects a key of a Secret in the
                          same namespace.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      apiUrl:
                        description: |-
                          APIURL of the Daytona API (e.g. https://app.daytona.io/api); the
                          upstream control plane requires it, and deletion refuses to sweep
                          against an SDK fallback URL.
                        minLength: 1
                        type: string
                      baseSnapshot:
                        description: |-
                          BaseSnapshot names an externally owned, prebuilt Daytona snapshot to
                          use as-is. Empty means the operator builds and manages the base
                          snapshot from the release's bundled runtime.
                        type: string
                      target:
                        type: string
                    required:
                    - apiKeySecretRef
                    - apiUrl
                    type: object
                  inactivityTimeoutMs:
                    description: InactivityTimeoutMS stops idle sandboxes after this
                      many milliseconds.
                    format: int64
                    type: integer
                  modal:
                    description: |-
                      ModalSandboxSpec configures the Modal sandbox provider. The operator
                      deploys the pinned upstream Modal app itself (modal-deploy Job) and
                      discovers its endpoints; nothing endpoint-shaped is configured here.
                    properties:
                      apiSecretSecretRef:
                        description: SecretKeyRef selects a key of a Secret in the
                          same namespace.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      environment:
                        default: main
                        description: |-
                          Environment is the Modal environment NAME the app is deployed in and
                          resolved from during cleanup.
                        type: string
                      tokenIdSecretRef:
                        description: SecretKeyRef selects a key of a Secret in the
                          same namespace.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      tokenSecretSecretRef:
                        description: SecretKeyRef selects a key of a Secret in the
                          same namespace.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      workspace:
                        type: string
                    required:
                    - apiSecretSecretRef
                    - tokenIdSecretRef
                    - tokenSecretSecretRef
                    - workspace
                    type: object
                  openComputer:
                    description: OpenComputerSandboxSpec configures the OpenComputer
                      sandbox provider.
                    properties:
                      anthropicApiKeySecretRef:
                        description: |-
                          AnthropicAPIKeySecretRef is passed into sandboxes as ANTHROPIC_API_KEY
                          so the agent can call the model (upstream requires it for this
                          provider).
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      apiKeySecretRef:
                        description: SecretKeyRef selects a key of a Secret in the
                          same namespace.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      apiUrl:
                        type: string
                      template:
                        description: Template is the OpenComputer template/snapshot
                          to boot sandboxes from.
                        type: string
                    required:
                    - apiKeySecretRef
                    - apiUrl
                    - template
                    type: object
                  provider:
                    enum:
                    - modal
                    - daytona
                    - vercel
                    - opencomputer
                    type: string
                  runtime:
                    description: Runtime tunes the operator-managed provider base
                      artifact.
                    properties:
                      deletionPolicy:
                        default: Delete
                        description: |-
                          DeletionPolicy controls whether managed artifacts are deleted with
                          the CR. Orphan retains them and records their references in status
                          and events before the finalizer is removed.
                        enum:
                        - Delete
                        - Orphan
                        type: string
                      image:
                        description: |-
                          Image overrides the container base the managed artifact builds FROM.
                          It must be an image built from this operator's runtime manifest —
                          normally ghcr.io/dirien/openinspect-sandbox-runtime, pinned by digest
                          (the reference string identifies the artifact, so a mutable tag that
                          is re-pushed does NOT trigger a rebuild). Empty means the release's
                          bundled runtime recipe, built from its base image.
                        maxLength: 512
                        type: string
                      updatePolicy:
                        default: OnUpgrade
                        description: |-
                          UpdatePolicy controls when the managed artifact is rebuilt:
                          OnUpgrade rebuilds whenever the release's runtime digest changes;
                          Never keeps the current artifact (the reference still flips if one
                          with the current digest already exists).
                        enum:
                        - OnUpgrade
                        - Never
                        type: string
                    type: object
                  vercel:
                    description: |-
                      VercelSandboxSpec configures the Vercel sandbox provider. The control
                      plane calls the Vercel Sandbox REST API directly.
                    properties:
                      apiBaseUrl:
                        type: string
                      baseSnapshotId:
                        description: BaseSnapshotID pins a prebuilt snapshot by ID.
                        type: string
                      baseSnapshotName:
                        description: BaseSnapshotName pins a prebuilt snapshot by
                          name.
                        type: string
                      projectId:
                        type: string
                      runtime:
                        default: node24
                        type: string
                      snapshotExpirationMs:
                        format: int64
                        type: integer
                      teamId:
                        type: string
                      tokenSecretRef:
                        description: SecretKeyRef selects a key of a Secret in the
                          same namespace.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    required:
                    - projectId
                    - tokenSecretRef
                    type: object
                required:
                - provider
                type: object
              suspended:
                description: |-
                  Suspended pauses reconciliation: no Cloudflare calls, no pruning, and
                  the web Deployment is scaled to zero. Nothing is deleted; setting it
                  back to false resumes where things left off. Deletion still finalizes
                  normally while suspended.
                type: boolean
              web:
                description: WebSpec runs the web UI inside the cluster as a Deployment
                  + Service.
                properties:
                  env:
                    additionalProperties:
                      type: string
                    description: Env are plain environment variables.
                    maxProperties: 128
                    type: object
                  image:
                    description: |-
                      Image overrides the web app container image. Empty selects the
                      release's web image for the CR's sandbox provider
                      (ghcr.io/dirien/openinspect-web, one variant per provider); the
                      operator wires the deployment-specific control-plane URLs into it at
                      runtime (OI_WS_URL / CONTROL_PLANE_URL), so no per-deployment image
                      build is needed.
                    type: string
                  port:
                    default: 3000
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  replicas:
                    default: 1
                    format: int32
                    minimum: 0
                    type: integer
                  secretEnv:
                    description: SecretEnv injects environment variables from Secret
                      keys.
                    items:
                      description: WorkerSecret maps a Kubernetes Secret key to a
                        secret binding / env var.
                      properties:
                        binding:
                          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                          type: string
                        secretRef:
                          description: SecretKeyRef selects a key of a Secret in the
                            same namespace.
                          properties:
                            key:
                              type: string
                            name:
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - binding
                      - secretRef
                      type: object
                    maxItems: 64
                    type: array
                type: object
              workers:
                items:
                  description: WorkerSpec describes one Cloudflare Worker.
                  properties:
                    bindings:
                      description: |-
                        WorkerBindings groups all binding kinds for one worker. The per-list caps
                        stay within Cloudflare's own limit of 64 bindings per worker.
                      properties:
                        d1:
                          items:
                            description: D1Binding attaches the database to a worker.
                            properties:
                              binding:
                                description: Binding is the variable name exposed
                                  to the worker (e.g. DB).
                                type: string
                            required:
                            - binding
                            type: object
                          maxItems: 64
                          type: array
                        durableObjects:
                          items:
                            description: DurableObjectBinding declares a Durable Object
                              class the worker defines.
                            properties:
                              binding:
                                type: string
                              className:
                                type: string
                            required:
                            - binding
                            - className
                            type: object
                          maxItems: 64
                          type: array
                        kv:
                          items:
                            description: KVBinding attaches a KV namespace to a worker.
                            properties:
                              binding:
                                type: string
                              namespace:
                                description: Namespace is the logical name from spec.kvNamespaces.
                                type: string
                            required:
                            - binding
                            - namespace
                            type: object
                          maxItems: 64
                          type: array
                        r2:
                          items:
                            description: R2Binding attaches an R2 bucket to a worker.
                            properties:
                              binding:
                                type: string
                              bucket:
                                description: Bucket is the logical name from spec.r2Buckets.
                                type: string
                            required:
                            - binding
                            - bucket
                            type: object
                          maxItems: 64
                          type: array
                        services:
                          items:
                            description: ServiceBinding attaches another worker managed
                              by this CR.
                            properties:
                              binding:
                                type: string
                              worker:
                                description: |-
                                  Worker is the logical name from spec.workers. If the target worker does
                                  not exist on Cloudflare yet, the binding is added on a later reconcile
                                  pass once it does.
                                type: string
                            required:
                            - binding
                            - worker
                            type: object
                          maxItems: 64
                          type: array
                      type: object
                    compatibilityDate:
                      default: "2024-12-30"
                      type: string
                    compatibilityFlags:
                      items:
                        type: string
                      maxItems: 32
                      type: array
                    cron:
                      description: Cron schedules for the worker (e.g. "* * * * *").
                      items:
                        type: string
                      maxItems: 10
                      type: array
                    name:
                      description: |-
                        Name is the logical name (e.g. control-plane). The Cloudflare script
                        name becomes <namePrefix>-<name>-<deploymentName>.
                      pattern: ^[a-z0-9][a-z0-9-]*$
                      type: string
                    script:
                      description: |-
                        Script overrides where the worker bundle comes from (development
                        only). Empty uses the release's embedded bundle for this worker name
                        (control-plane, github-bot, slack-bot, linear-bot), built from the
                        pinned upstream revision.
                      properties:
                        configMapRef:
                          description: ConfigMapKeyRef selects a key of a ConfigMap
                            in the same namespace.
                          properties:
                            key:
                              type: string
                            name:
                              type: string
                          required:
                          - key
                          - name
                          type: object
                        url:
                          maxLength: 2048
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of configMapRef or url must be set
                        rule: has(self.configMapRef) != has(self.url)
                    secrets:
                      description: Secrets become secret_text bindings, values read
                        from Secrets.
                      items:
                        description: WorkerSecret maps a Kubernetes Secret key to
                          a secret binding / env var.
                        properties:
                          binding:
                            pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                            type: string
                          secretRef:
                            description: SecretKeyRef selects a key of a Secret in
                              the same namespace.
                            properties:
                              key:
                                type: string
                              name:
                                type: string
                            required:
                            - key
                            - name
                            type: object
                        required:
                        - binding
                        - secretRef
                        type: object
                      maxItems: 64
                      type: array
                    vars:
                      additionalProperties:
                        type: string
                      description: Vars become plain_text bindings (environment variables).
                      maxProperties: 128
                      type: object
                  required:
                  - name
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - cloudflare
            - deploymentName
            type: object
          status:
            description: OpenInspectStatus defines the observed state of OpenInspect.
            properties:
              appSecrets:
                description: |-
                  AppSecrets records what was last seeded into the platform's global
                  secrets store, so removed keys can be deleted and unchanged values
                  skip the round-trip.
                properties:
                  appliedHash:
                    description: AppliedHash is the hash of the last seeded key/value
                      set.
                    type: string
                  keys:
                    description: Keys are the store keys this CR manages; used to
                      prune removed ones.
                    items:
                      type: string
                    type: array
                type: object
              appliedMigrations:
                description: AppliedMigrations is the number of migrations recorded
                  as applied.
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              d1DatabaseId:
                description: D1DatabaseID is the UUID of the created database.
                type: string
              kvNamespaceIds:
                additionalProperties:
                  type: string
                description: KVNamespaceIDs maps logical KV names to Cloudflare namespace
                  IDs.
                type: object
              modalApp:
                description: ModalApp records the operator-deployed upstream Modal
                  app.
                properties:
                  appId:
                    type: string
                  deployedSourceRevision:
                    description: DeployedSourceRevision is the upstream commit the
                      deploy Job ran.
                    type: string
                  healthUrl:
                    description: HealthURL is the discovered api-health endpoint of
                      the deployed app.
                    type: string
                  lastDeployTime:
                    format: date-time
                    type: string
                  secretsHash:
                    description: |-
                      SecretsHash fingerprints the Modal secret inputs last converged
                      (HMAC-keyed; never reversible to values).
                    type: string
                  webSuffix:
                    description: |-
                      WebSuffix is the environment web suffix discovered from the deployed
                      endpoints ("" for the default environment); it is what the operator
                      injects as MODAL_ENVIRONMENT_WEB_SUFFIX.
                    type: string
                type: object
              observedGeneration:
                format: int64
                type: integer
              r2Buckets:
                additionalProperties:
                  type: string
                description: |-
                  R2Buckets maps logical bucket names to full Cloudflare bucket names, so
                  deletion works from observed state even after spec edits.
                type: object
              sandboxRuntime:
                description: SandboxRuntime records the managed provider base artifact.
                properties:
                  artifactId:
                    type: string
                  artifactName:
                    description: |-
                      ArtifactName/ArtifactID identify the remote artifact (e.g. the
                      Daytona snapshot). The name embeds the digest, so a changed bundle
                      is a new artifact, never a mutation.
                    type: string
                  digest:
                    type: string
                  lastBuildTime:
                    format: date-time
                    type: string
                  observedGeneration:
                    format: int64
                    type: integer
                  phase:
                    type: string
                  previousArtifacts:
                    description: |-
                      PreviousArtifacts are superseded managed artifacts retained for the
                      rollback grace period before garbage collection.
                    items:
                      description: RetiredArtifact is a superseded managed artifact
                        awaiting GC.
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        retiredAt:
                          format: date-time
                          type: string
                      required:
                      - name
                      - retiredAt
                      type: object
                    maxItems: 10
                    type: array
                  provider:
                    type: string
                  sourceRevision:
                    description: |-
                      SourceRevision is the pinned upstream commit the active artifact was
                      built from; Digest is its canonical runtime bundle digest (sha256:...).
                    type: string
                type: object
              workers:
                additionalProperties:
                  description: WorkerStatus records what is live for one worker.
                  properties:
                    appliedHash:
                      description: |-
                        AppliedHash is the hash of the last uploaded version's inputs (script
                        content, bindings, vars, secret values). A new version is only uploaded
                        when it changes.
                      type: string
                    doClasses:
                      description: |-
                        DOClasses records Durable Object classes already declared to Cloudflare
                        via migrations; new spec classes are diffed against this on upload.
                      items:
                        type: string
                      type: array
                    scriptName:
                      description: ScriptName is the full Cloudflare script name.
                      type: string
                    serviceBindingsPending:
                      description: |-
                        ServiceBindingsPending lists service bindings waiting for their target
                        worker to exist.
                      items:
                        type: string
                      type: array
                  type: object
                description: Workers maps logical worker names to their live state.
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end -}}
