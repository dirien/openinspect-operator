# [MANAGER]: Manager Deployment Configurations
controllerManager:
  replicas: 1
  container:
    image:
      # -- Operator image; the release publishes ghcr.io/dirien/openinspect-operator.
      repository: ghcr.io/dirien/openinspect-operator
      # -- Image tag. Empty follows the chart appVersion as v<appVersion>,
      # which matches the release tagging — a released chart installs its
      # matching images with no overrides.
      tag: ""
    imagePullPolicy: IfNotPresent
    # -- Image run by runtime-build Jobs (needs /runtime-builder from this
    # repository). Empty follows the manager image, which is almost always
    # right since the operator image ships both binaries.
    runtimeBuilderImage: ""
    # -- Image run by modal-deploy Jobs (pinned Modal CLI + pinned upstream
    # app source). Empty selects the release-matched
    # ghcr.io/dirien/openinspect-modal-deploy image.
    modalDeployImage: ""
    # -- Release web image for provider modal (spec.web.image empty). Empty
    # selects the release-matched ghcr.io/dirien/openinspect-web image.
    webImageModal: ""
    # -- Release web image for provider daytona (spec.web.image empty).
    # Empty selects the release-matched ghcr.io/dirien/openinspect-web image.
    webImageDaytona: ""
    args:
      - "--leader-elect"
      - "--metrics-bind-address=:8443"
      - "--health-probe-bind-address=:8081"
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: 8081
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        path: /readyz
        port: 8081
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 10
  serviceAccountName: openinspect-operator-controller-manager

# [RBAC]: To enable RBAC (Permissions) configurations
rbac:
  enable: true

# [CRDs]: To enable the CRDs
crd:
  # This option determines whether the CRDs are included
  # in the installation process.
  enable: true

  # Enabling this option adds the "helm.sh/resource-policy": keep
  # annotation to the CRD, ensuring it remains installed even when
  # the Helm release is uninstalled.
  # NOTE: Removing the CRDs will also remove all cert-manager CR(s)
  # (Certificates, Issuers, ...) due to garbage collection.
  keep: true

# [METRICS]: Set to true to generate manifests for exporting metrics.
# To disable metrics export set false, and ensure that the
# ControllerManager argument "--metrics-bind-address=:8443" is removed.
metrics:
  enable: true

# [PROMETHEUS]: To enable a ServiceMonitor to export metrics to Prometheus set true
prometheus:
  enable: false

# [CERT-MANAGER]: To enable cert-manager injection to webhooks set true
certmanager:
  enable: false

# [NETWORK POLICIES]: To enable NetworkPolicies set true
networkPolicy:
  enable: false
